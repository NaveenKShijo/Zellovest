name: CI application

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/telemetry/**"
      - ".github/workflows/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/telemetry/**"
      - ".github/workflows/**"
      - "README.md"
permissions:
  contents: read

concurrency:
  group: zellovest-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/workers
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/services/workers/uv.lock

      - name: Install locked worker dependencies
        run: uv sync --locked --extra dev

      - name: Run forecasting tests
        env:
          PYTHONPATH: src:../../shared/src
        run: uv run --locked pytest ../../tests/test_seat_forecasting_worker.py ../../tests/test_synthetic_seat_ingestion.py ../../tests/test_vertex_training_submission.py -q

      - name: Lint forecasting code
        run: >-
          uv run --locked ruff check
          src/zellovest_workers/ml
          src/zellovest_workers/tasks/seat_forecasting.py
          ../../tests/test_seat_forecasting_worker.py
          ../../tests/test_synthetic_seat_ingestion.py
          ../../tests/test_vertex_training_submission.py
          ../../shared/src/zellovest_shared/config.py

      - name: Type check forecasting code
        env:
          MYPYPATH: ../../shared/src
        run: >-
          uv run --locked mypy --python-version 3.13 --ignore-missing-imports
          --follow-imports=skip
          src/zellovest_workers/ml
          src/zellovest_workers/tasks/seat_forecasting.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: node --test tests/*.test.mjs

  build_images:
    name: Build application images for pull requests
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build all runtime images without publishing
        run: |
          set -euo pipefail
          docker build --file backend/Dockerfile --tag zellovest-ci/zellovest-migrate:pr backend
          docker build --file backend/services/procurement-core/Dockerfile --tag zellovest-ci/zellovest-procurement-core:pr backend
          docker build --file backend/services/ingestion-api/Dockerfile --tag zellovest-ci/zellovest-ingestion-api:pr backend
          docker build --file backend/services/agentic-reasoning/Dockerfile --tag zellovest-ci/zellovest-agentic-reasoning:pr backend
          docker build --file backend/services/mcp-servers/Dockerfile --tag zellovest-ci/zellovest-mcp-servers:pr backend
          docker build --file backend/services/workers/Dockerfile --tag zellovest-ci/zellovest-workers:pr backend
          docker build --file frontend/Dockerfile \
            --build-arg INGESTION_API_URL=http://ingestion-api:8003 \
            --build-arg AGENTIC_API_URL=http://agentic-reasoning:8002 \
            --build-arg NEXT_PUBLIC_ORGANIZATION_NAME="${{ vars.NEXT_PUBLIC_ORGANIZATION_NAME || 'Zellovest' }}" \
            --tag zellovest-ci/zellovest-frontend:pr frontend

  publish_images:
    name: Publish application images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ARTIFACT_REGISTRY_LOCATION: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      NEXT_PUBLIC_ORGANIZATION_NAME: ${{ vars.NEXT_PUBLIC_ORGANIZATION_NAME || 'Zellovest' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate publishing configuration
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for value in GCP_PROJECT_ID GCP_ARTIFACT_REGISTRY_LOCATION GCP_ARTIFACT_REGISTRY_REPOSITORY GCP_SERVICE_ACCOUNT GCP_WIF_PROVIDER; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub variable or secret: $value" >&2
              exit 1
            fi
          done
          if [[ "$GCP_ARTIFACT_REGISTRY_LOCATION" == *-docker.pkg.dev ]]; then
            echo "GCP_ARTIFACT_REGISTRY_LOCATION must be a location only, such as us-central1." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Configure Google Cloud CLI
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry Docker access
        if: github.event_name == 'push'
        env:
          GAR_HOST: ${{ env.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev
        run: gcloud auth configure-docker "$GAR_HOST" --quiet

      - name: Build all runtime images and publish commit-SHA tags on main
        env:
          PUBLISH_IMAGES: "true"
          IMAGE_TAG: ${{ github.sha }}
          GAR_HOST: ${{ env.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev
        run: |
          set -euo pipefail

          build_image() {
            local name="$1"
            local dockerfile="$2"
            local context="$3"
            local image

            if [[ "$PUBLISH_IMAGES" == "true" ]]; then
              image="$GAR_HOST/$GCP_PROJECT_ID/$GCP_ARTIFACT_REGISTRY_REPOSITORY/$name:$IMAGE_TAG"
              if gcloud artifacts docker images describe "$image" --format="value(image_summary.digest)" >/dev/null 2>&1; then
                echo "Image already exists for this commit: $image"
                return
              fi
            else
              image="zellovest-ci/$name:$IMAGE_TAG"
            fi

            if [[ "$name" == "zellovest-frontend" ]]; then
              docker build --file "$dockerfile" \
                --build-arg INGESTION_API_URL=http://ingestion-api:8003 \
                --build-arg AGENTIC_API_URL=http://agentic-reasoning:8002 \
                --build-arg NEXT_PUBLIC_ORGANIZATION_NAME="$NEXT_PUBLIC_ORGANIZATION_NAME" \
                --tag "$image" "$context"
            else
              docker build --file "$dockerfile" --tag "$image" "$context"
            fi

            if [[ "$PUBLISH_IMAGES" == "true" ]]; then
              docker push "$image"
              echo "Published $image"
            fi
          }

          build_image zellovest-migrate backend/Dockerfile backend
          build_image zellovest-procurement-core backend/services/procurement-core/Dockerfile backend
          build_image zellovest-ingestion-api backend/services/ingestion-api/Dockerfile backend
          build_image zellovest-agentic-reasoning backend/services/agentic-reasoning/Dockerfile backend
          build_image zellovest-mcp-servers backend/services/mcp-servers/Dockerfile backend
          build_image zellovest-workers backend/services/workers/Dockerfile backend
          build_image zellovest-frontend frontend/Dockerfile frontend
