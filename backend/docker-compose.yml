# Zellovest - full local single-tenant stack (PRD 27.5).
#
# Usage, from backend/:
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down
#
# Services: PostgreSQL, Redis, Qdrant, Alembic migrations, the three FastAPI
# services, the three MCP servers, the Celery workers + beat, and the Next.js
# frontend. All container-to-container traffic uses Compose service names; the
# only Traefik publishes public HTTP/S ports; application services stay on
# Compose networks.
#
# The project name intentionally stays the default (the `backend` directory)
# so the existing `backend_pgdata` / `backend_qdrantdata` volumes are reused.

# Shared runtime overrides. `env_file: .env` still supplies the secrets and
# integration credentials, while these values replace every host-localhost URL
# with the in-network service name.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://zellovest:zellovest@postgres:5432/zellovest
  ASYNC_DATABASE_URL: postgresql+asyncpg://zellovest:zellovest@postgres:5432/zellovest
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json

# GCP service-account JSON mounted read-only. Set
# GOOGLE_APPLICATION_CREDENTIALS_HOST in backend/.env (host path).
x-gcp-credentials: &gcp-credentials
  - type: bind
    source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./secrets/gcp-sa.json}
    target: /run/secrets/gcp-sa.json
    read_only: true

services:
  # Public ingress. DNS for APP_DOMAIN must point at this VM, and GCP firewall
  # rules must allow inbound TCP 80/443 for HTTP challenge and HTTPS traffic.
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=zellovest-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in backend/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - proxy
    restart: unless-stopped

  # --- Infrastructure -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zellovest
      POSTGRES_PASSWORD: zellovest
      POSTGRES_DB: zellovest
    ports:
      # Host 5433: avoids clash with a system PostgreSQL on the default 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zellovest -d zellovest"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]
    restart: unless-stopped

  # --- Schema migrations (one-shot) ----------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  # --- HTTP services --------------------------------------------------------
  procurement-core:
    build:
      context: .
      dockerfile: services/procurement-core/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: procurement-core
      SERVICE_PORT: 8001
    volumes: *gcp-credentials
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: ingestion-api
      SERVICE_PORT: 8003
    volumes: *gcp-credentials
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  agentic-reasoning:
    build:
      context: .
      dockerfile: services/agentic-reasoning/Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: agentic-reasoning
      SERVICE_PORT: 8002
      MCP_PROCUREMENT_URL: http://mcp-procurement:8101/mcp
      MCP_DOCUMENT_URL: http://mcp-documents:8102/mcp
      MCP_EXTERNAL_URL: http://mcp-external:8103/mcp
    volumes: *gcp-credentials
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      mcp-procurement: {condition: service_started}
      mcp-documents: {condition: service_started}
      mcp-external: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # --- MCP servers (one process per logical server) -------------------------
  mcp-procurement:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: mcp-procurement
      SERVICE_PORT: 8101
    volumes: *gcp-credentials
    command:
      - uvicorn
      - zellovest_mcp.main_procurement:app
      - --host
      - "0.0.0.0"
      - --port
      - "8101"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  mcp-documents:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: mcp-documents
      SERVICE_PORT: 8102
    volumes: *gcp-credentials
    command:
      - uvicorn
      - zellovest_mcp.main_documents:app
      - --host
      - "0.0.0.0"
      - --port
      - "8102"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  mcp-external:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: mcp-external
      SERVICE_PORT: 8103
    volumes: *gcp-credentials
    command:
      - uvicorn
      - zellovest_mcp.main_external:app
      - --host
      - "0.0.0.0"
      - --port
      - "8103"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # --- Background workers ---------------------------------------------------
  worker-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: worker-ingestion
    command:
      - celery
      - -A
      - zellovest_workers.celery_app.celery_app
      - worker
      - -Q
      - ingestion_tasks
      - --loglevel=info
      - --concurrency=2
    volumes: *gcp-credentials
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker-documents:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: worker-documents
    command:
      - celery
      - -A
      - zellovest_workers.celery_app.celery_app
      - worker
      - -Q
      - document_tasks
      - --loglevel=info
      - --concurrency=2
    volumes: *gcp-credentials
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: worker-analytics
    command:
      - celery
      - -A
      - zellovest_workers.celery_app.celery_app
      - worker
      - -Q
      - analytics_tasks
      - --loglevel=info
      - --concurrency=2
    volumes: *gcp-credentials
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # Single-replica Celery Beat. Do not scale past 1 replica (double-fire).
  # The schedule file lives in the beatdata volume so restarts resume cleanly.
  scheduler-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      <<: *app-env
      SERVICE_NAME: scheduler-beat
    command:
      - celery
      - -A
      - zellovest_workers.celery_app.celery_app
      - beat
      - --loglevel=info
      - --schedule
      - /var/run/celery/celerybeat-schedule
    volumes:
      - beatdata:/var/run/celery
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    deploy:
      replicas: 1
    restart: unless-stopped

  # --- Frontend -------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into next.config.ts rewrites at build time.
        INGESTION_API_URL: http://ingestion-api:8003
        AGENTIC_API_URL: http://agentic-reasoning:8002
        NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-Zellovest}
    environment:
      NODE_ENV: production
      INGESTION_API_URL: http://ingestion-api:8003
      AGENTIC_API_URL: http://agentic-reasoning:8002
      NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-Zellovest}
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=zellovest-proxy
      - "traefik.http.routers.zellovest.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in backend/.env}`)"
      - traefik.http.routers.zellovest.entrypoints=websecure
      - traefik.http.routers.zellovest.tls=true
      - traefik.http.routers.zellovest.tls.certresolver=letsencrypt
      - traefik.http.services.zellovest.loadbalancer.server.port=3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      ingestion-api: {condition: service_healthy}
      agentic-reasoning: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  beatdata:
  traefik-certs:

networks:
  proxy:
    name: zellovest-proxy
