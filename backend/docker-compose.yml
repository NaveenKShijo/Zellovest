services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zellovest
      POSTGRES_PASSWORD: zellovest
      POSTGRES_DB: zellovest
    ports:
      # Host 5433: avoids clash with a system PostgreSQL on the default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker-ingestion:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    env_file: [.env]
    environment:
      SERVICE_NAME: worker-ingestion
    command: ["celery", "-A", "zellovest_workers.celery_app.celery_app", "worker", "-Q", "ingestion_tasks", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      
