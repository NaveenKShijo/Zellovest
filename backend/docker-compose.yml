services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zellovest
      POSTGRES_PASSWORD: zellovest
      POSTGRES_DB: zellovest
    ports:
      # Host 5433: avoids clash with a system PostgreSQL on the default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]
   
  agentic-reasoning:
    build:
      context: .
      dockerfile: services/agentic-reasoning/Dockerfile
    env_file: [.env]
    environment:
      SERVICE_NAME: agentic-reasoning
      SERVICE_PORT: 8002
      QDRANT_URL: http://qdrant:6333
    ports: ["8002:8002"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started} 

