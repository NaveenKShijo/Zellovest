[project]
name = "zellovest"
version = "0.1.0"
description = "AI-native procurement intelligence platform - microservices dev/test umbrella (services/* + shared/)"
authors = [
    { name = "Naveen", email = "naveenshijo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42.0",
    "structlog>=24.1",
    "boto3>=1.34",
    "python-dotenv",
    # NOTE: python-jose is intentionally NOT a root dependency. Its wheel
    # (and its pyasn1 transitive dep) is unavailable offline, and nothing in
    # the test path calls JWT functions (zellovest_shared.security.jwt imports
    # jose lazily with a clear error). Service Docker images install
    # python-jose via services/*/pyproject.toml, where it is declared.
    # NOTE: pinned to the version vendored in backend/wheels/ (this env has
    # no PyPI access to fetch newer wheels). Relax once network is back.
    "python-multipart==0.0.21",
]

# The root is a dev/test umbrella, not an installable package (there is no
# importable top-level module since src/zellovest was removed). Setting
# package = false stops uv from trying to build a stale editable install.
[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# B008: Depends() in defaults is the canonical FastAPI DI idiom.
# BLE001: broad guards at robustness boundaries (task/redis/import) log + re-raise.
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "shared/src",
    "services/ingestion-api/src",
    "services/procurement-core/src",
    "services/agentic-reasoning/src",
    "services/workers/src",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
