[project]
name = "zellovest-mcp-servers"
version = "1.0.0"
description = "Zellovest MCP-1 Procurement Intelligence, MCP-2 Document Knowledge, MCP-3 External Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zellovest-shared @ file://../../shared",
    "mcp>=1.9,<2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "PTH", "RUF"]
ignore = ["C901", "PTH101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
