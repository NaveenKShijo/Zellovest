[project]
name = "zellovest-ingestion-api"
version = "0.1.0"
description = "Ingestion & Document Ingress API - Ramp/Okta webhooks, cloud drive connectors, file upload staging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zellovest-shared",
    "zellovest-procurement-core",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.26",
    "python-multipart>=0.0.6",
    "google-cloud-storage>=2.18",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
zellovest-shared = { workspace = true }
zellovest-procurement-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "C90", "PTH", "RUF"]
ignore = ["C901", "PTH101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
