[project]
name = "zellovest-agentic-reasoning"
version = "0.1.0"
description = "Agentic Reasoning & Ask AI Service - Natural language understanding, tool calling, RAG orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zellovest-shared @ file://../../shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.26",
    "openai>=1.10",
    "anthropic>=0.18",
    "langchain>=0.1",
    "langgraph>=0.0.20",
    "mcp>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "C90", "PTH", "RUF"]
ignore = ["C901", "PTH101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true